<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="description" content="Kurai 3D Assets — game-ready 3D assets by Vladyslav, a 3D artist from Ukraine.">
  <title>Kurai 3D Assets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="desktop-backdrop" aria-hidden="true">
    <div class="side-blueprint side-blueprint-left"></div>
    <div class="side-blueprint side-blueprint-right"></div>
  </div>

  <main class="page-shell">
    <header class="profile-card" id="profile"></header>

    <section class="catalog" aria-label="3D asset catalog">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.15A7.5 7.5 0 1 1 4 11.5a7.5 7.5 0 0 1 15 0Z"/></svg>
        <input id="asset-search" type="search" placeholder="Search assets..." autocomplete="off" aria-label="Search assets">
      </div>

      <div id="asset-list" class="asset-list"></div>
      <p id="empty-state" class="empty-state" hidden>No assets found.</p>
      <button id="load-more" class="load-more" type="button" hidden>Show more</button>
    </section>

    <footer class="footer">© <span id="year"></span> Kurai 3D Assets</footer>
  </main>

  <div id="lightbox" class="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Image gallery">
    <button class="lightbox-close" type="button" aria-label="Close gallery">×</button>
    <button class="lightbox-nav lightbox-prev" type="button" aria-label="Previous image">‹</button>
    <figure class="lightbox-stage">
      <img id="lightbox-image" alt="">
      <figcaption id="lightbox-counter"></figcaption>
    </figure>
    <button class="lightbox-nav lightbox-next" type="button" aria-label="Next image">›</button>
  </div>

  <script src="site-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
